# Local Postgres for development and DB tests only (production is Neon).
# Start: docker compose up -d db    URL: postgresql://tipoff:tipoff@localhost:5433/tipoff
services:
  db:
    image: postgres:17
    container_name: tipoff-db
    environment:
      POSTGRES_USER: tipoff
      POSTGRES_PASSWORD: tipoff
      POSTGRES_DB: tipoff
    ports:
      - "5433:5432"
    volumes:
      - tipoff-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipoff"]
      interval: 2s
      retries: 30
volumes:
  tipoff-db:
