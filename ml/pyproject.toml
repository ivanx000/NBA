[project]
name = "tipoff"
version = "0.1.0"
description = "Tip-Off: NBA game outcome and player stat forecaster (ML pipeline)."
readme = "README.md"
license = "MIT"
authors = [{ name = "ivanxie" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow==3.18.0",
    "nba-api==1.12.0",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "scikit-learn==1.9.1",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
]

[project.scripts]
tipoff = "tipoff.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PD", "NPY"]

[tool.ruff.lint.per-file-ignores]
# pandera: @dataframe_check methods are classmethods; Config uses class-level lists.
"src/tipoff/ingest/schemas.py" = ["N805", "RUF012"]
"src/tipoff/features/schemas.py" = ["N805", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
]
