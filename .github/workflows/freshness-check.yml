name: freshness-check

# Fails (GitHub emails the repo owner) if any of today's games has no live pregame prediction.
# Syncs games first so today's slate is current. Never calls stats.nba.com.
on:
  schedule:
    - cron: "37 15 * * *" # ~10:37 ET (EST) / 11:37 ET (EDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - name: Skip until the DATABASE_URL secret exists
        id: gate
        run: if [ -z "$DATABASE_URL_PROD" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::DATABASE_URL secret not set; skipping"; fi
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.gate.outputs.skip != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - if: steps.gate.outputs.skip != 'true'
        run: uv sync --locked
      - if: steps.gate.outputs.skip != 'true'
        run: uv run tipoff sync --target prod
      - if: steps.gate.outputs.skip != 'true'
        run: uv run tipoff freshness-check --target prod
